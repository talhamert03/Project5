name: Inkfall Android derlemesi

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.MK_KEYSTORE_BASE64 != '' }}
      MK_VERSION_CODE: ${{ github.run_number }}
      MK_VERSION_NAME: '1.8.1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Tip denetimi + web derlemesi
        run: npm run build

      - name: Web dosyalarını Android projesine kopyala
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu-latest makinelerinde Android SDK hazır gelir (ANDROID_HOME tanımlı)
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Test APK'sı (debug)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: APK adı
        run: cp android/app/build/outputs/apk/debug/Inkfall-*-debug.apk "Inkfall-$MK_VERSION_NAME.apk" && ls -la Inkfall-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: inkfall-apk
          path: Inkfall-*.apk

      # En güncel APK'yı 'apk' dalına da koy (tek dosya, geçmişsiz; git ile kolayca indirilebilir)
      - name: APK dalını güncelle
        if: github.event_name == 'push' && !startsWith(github.ref_name, 'apk')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk" && cp Inkfall-*.apk "$RUNNER_TEMP/apk/"
          cd "$RUNNER_TEMP/apk"
          git init -q -b apk
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Inkfall $MK_VERSION_NAME ($GITHUB_REF_NAME @ ${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk

      - name: Play Store paketi (imzalı AAB)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          MK_KEYSTORE_BASE64: ${{ secrets.MK_KEYSTORE_BASE64 }}
          MK_KEYSTORE_PASSWORD: ${{ secrets.MK_KEYSTORE_PASSWORD }}
          MK_KEY_ALIAS: ${{ secrets.MK_KEY_ALIAS }}
          MK_KEY_PASSWORD: ${{ secrets.MK_KEY_PASSWORD }}
        run: |
          echo "$MK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          MK_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: inkfall-aab
          path: android/app/build/outputs/bundle/release/*.aab
